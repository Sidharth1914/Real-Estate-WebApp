version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: real-estate-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      - mongodb_data:/data/db
    networks:
      - real-estate-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: real-estate-backend
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/real-estate-db
      JWT_SECRET: your_jwt_secret_key_change_this_in_production
      NODE_ENV: production
    depends_on:
      - mongodb
    networks:
      - real-estate-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: real-estate-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - real-estate-network
    restart: unless-stopped

volumes:
  mongodb_data:

networks:
  real-estate-network:
    driver: bridge
